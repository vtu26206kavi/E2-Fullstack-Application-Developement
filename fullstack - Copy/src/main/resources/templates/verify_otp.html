<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-color);">

    <div class="glass-card" style="width: 100%; max-width: 400px; text-align: center;">
        <h2 style="color: var(--primary-color); margin-bottom: 0.5rem;">Verify Your Account</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">We have sent a 6-digit OTP to your email.</p>
        
        <div th:if="${error}" style="background-color: #fee2e2; color: #dc2626; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;" th:text="${error}">
        </div>

        <form th:action="@{/verify-otp}" method="post">
            <input type="hidden" name="username" th:value="${username}" />
            
            <div class="form-group" style="text-align: left;">
                <label for="otp">Enter 6-Digit OTP</label>
                <input type="text" id="otp" name="otp" required maxlength="6" pattern="\d{6}" style="letter-spacing: 5px; text-align: center; font-size: 1.5rem; font-weight: bold;">
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Verify Account</button>
        </form>
    </div>
</body>
</html>

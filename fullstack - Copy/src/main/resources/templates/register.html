<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <div class="container" style="max-width: 600px; margin-top: 2rem;">
        <div class="glass-card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Create an Account</h2>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="role">I am a...</label>
                    <select id="role" th:field="*{role}" class="form-control" required>
                        <option value="STUDENT">Job Seeker</option>
                        <option value="EMPLOYER">Recruiter</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
            </form>
        </div>
    </div>
</body>
</html>

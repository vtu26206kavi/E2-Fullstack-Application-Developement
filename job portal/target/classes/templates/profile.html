<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <div class="container" style="max-width: 600px; margin-top: 2rem;">
        <div class="glass-card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">My Profile</h2>

            <div th:if="${param.success}" class="alert alert-success">Resume uploaded successfully!</div>
            <div th:if="${param.error}" class="alert alert-error" th:text="${param.error}">Error</div>

            <div style="margin-bottom: 2rem;">
                <p><strong>Full Name:</strong> <span th:text="${user.fullName}"></span></p>
                <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
                <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                <p><strong>Role:</strong> <span th:text="${user.role}"></span></p>
            </div>

            <div style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                <h3>Upload Resume (PDF, DOCX)</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
                    Current Resume: <span th:text="${user.resumeFileName != null ? user.resumeFileName : 'No resume uploaded yet.'}"></span>
                </p>
                
                <form th:action="@{/profile/uploadResume}" method="post" enctype="multipart/form-data" style="display: flex; gap: 1rem; align-items: center;">
                    <input type="file" name="file" class="form-control" style="background: rgba(15, 23, 42, 0.4);" required accept=".pdf,.doc,.docx">
                    <button type="submit" class="btn-primary">Upload</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

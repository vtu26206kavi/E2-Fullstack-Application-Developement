<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <div class="container" style="max-width: 800px; margin-top: 2rem;">
        <div class="glass-card">
            <h2 style="margin-bottom: 1.5rem;">Post a New Job</h2>

            <form th:action="@{/jobs/post}" th:object="${job}" method="post">
                <div class="form-group">
                    <label for="title">Job Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" th:field="*{category}" class="form-control" placeholder="e.g. IT, Marketing" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" th:field="*{location}" class="form-control" placeholder="e.g. Remote, New York" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="skillsRequired">Skills Required</label>
                    <input type="text" id="skillsRequired" th:field="*{skillsRequired}" class="form-control" placeholder="e.g. Java, Spring Boot, React">
                </div>

                <div class="form-group">
                    <label for="salary">Salary Range</label>
                    <input type="text" id="salary" th:field="*{salary}" class="form-control" placeholder="e.g. $80,000 - $100,000">
                </div>

                <div class="form-group">
                    <label for="description">Job Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="6" required></textarea>
                </div>

                <button type="submit" class="btn-primary">Post Job</button>
            </form>
        </div>
    </div>
</body>
</html>
